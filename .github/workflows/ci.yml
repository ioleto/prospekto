name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prospekto_test
          POSTGRES_USER: prospekto
          POSTGRES_PASSWORD: prospekto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prospekto -d prospekto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://prospekto:prospekto@localhost:5432/prospekto_test
      SESSION_SECRET: ci-session-secret
      ADMIN_USERNAME: admin
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python -c "from argon2 import PasswordHasher; print('argon2 import OK')"
      - name: Apply PostgreSQL migrations
        run: python -m app.migrate
      - name: Run tests
        run: python -m pytest -q

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --tag prospekto:ci .
