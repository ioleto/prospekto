# BLOCKED: the current application runtime supports SQLite only.
# Do not deploy this PostgreSQL stack until the adapter and PostgreSQL integration tests exist.
# Kept as a non-default reference only; it is not a supported production deployment.
services:
  # Disabled reference; remove this profile only after PostgreSQL adapter validation.
  web:
    profiles: ["blocked-postgresql"]
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on: [db]
    networks: [internal, swag]
    expose: ["8000"]
    read_only: true
    tmpfs: /tmp
  db:
    profiles: ["blocked-postgresql"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prospekto
      POSTGRES_USER: prospekto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [prospekto_pg:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U prospekto -d prospekto"], interval: 10s, timeout: 5s, retries: 5}
networks:
  internal:
    internal: true
  swag:
    external: true
    name: ${SWAG_NETWORK:-swag_default}
volumes: {prospekto_pg: {}}
