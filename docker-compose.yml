services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prospekto}
      POSTGRES_USER: ${POSTGRES_USER:-prospekto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [prospekto_pg:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'], interval: 5s, timeout: 5s, retries: 10}
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prospekto}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-prospekto}
      PROSPEKTO_MASTER_KEY: ${PROSPEKTO_MASTER_KEY:?set in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on: {db: {condition: service_healthy}}
    ports: ['127.0.0.1:${PROSPEKTO_PORT:-8000}:8000']
    command: sh -c 'python -m app.migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000'
volumes: {prospekto_pg:}
