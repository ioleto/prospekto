services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prospekto}
      POSTGRES_USER: ${POSTGRES_USER:-prospekto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [prospekto_pg:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prospekto}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-prospekto}
      SESSION_SECRET: ${SESSION_SECRET:?set in .env}
      SMTP_ENCRYPTION_KEY: ${SMTP_ENCRYPTION_KEY:?set in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set an Argon2 hash in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on: {db: {condition: service_healthy}}
    networks:
      - default
      - swag
    command: sh -c 'python -m app.migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000'
volumes: {prospekto_pg:}
networks:
  swag:
    external: true
    name: ${SWAG_NETWORK:?set in .env}
